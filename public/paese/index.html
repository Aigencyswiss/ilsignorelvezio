<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Il Paese di Elvezio</title>
<meta name="theme-color" content="#3E1019">
<link rel="icon" href="https://cdn.shopify.com/s/files/1/1109/0916/1797/files/elvezio-favicon_c93d7c97-d547-4b43-ba6a-5539fa708602.png?v=1793445822&width=64">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Montserrat:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#5C1F2B;--wine2:#3E1019;--gold:#C9962E;--gold2:#FFD24A;--cream:#FBF5E8;--cream2:#F1E6CF;--red:#E83B2B;--ink:#2A1A12}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a0a0e;color:var(--cream2);font:16px/1.5 'DM Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit}
#world{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;display:flex;align-items:center}
#world::-webkit-scrollbar{display:none}
#scene{position:relative;flex:0 0 auto;width:max(100vw,177.78vh);aspect-ratio:16/9}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.6s ease;user-select:none;-webkit-user-drag:none}
#night{opacity:0}
body.n #night{opacity:1}
/* atmosfera */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leaf{position:absolute;top:-6%;width:14px;height:10px;border-radius:70% 0 70% 0;background:#D9822B;opacity:.85;animation:fall linear infinite}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFE58A;box-shadow:0 0 10px 3px rgba(255,225,120,.8);opacity:0;animation:fly ease-in-out infinite}
body:not(.n) .fly{display:none}body.n .leaf{display:none}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-120px,115vh) rotate(720deg)}}
@keyframes fly{0%,100%{opacity:0;transform:translate(0,0)}30%{opacity:1}50%{transform:translate(30px,-24px)}70%{opacity:.8}}
/* hotspots */
.hs{position:absolute;transform:translate(-50%,-50%);width:0;height:0;z-index:3}
.hs button{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer}
.hs button:before,.hs button:after{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,#FFE9A8 0%,#FFD24A 45%,rgba(255,210,74,0) 72%);}
.hs button:after{inset:0;background:none;border:3px solid rgba(255,210,74,.9);animation:ping 2.2s ease-out infinite}
.hs.done button:before{background:radial-gradient(circle,#fff 0%,#9FE3B0 45%,rgba(159,227,176,0) 72%)}
.hs.done button:after{border-color:rgba(159,227,176,.9)}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.tag{position:absolute;left:0;top:-44px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(180deg,#8B5A2B,#6B3F1A);color:#FFF3D6;font:800 12px Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:6px;border:2px solid #4A2A10;box-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none;opacity:.95;transition:transform .2s}
.tag:after{content:"";position:absolute;left:50%;bottom:-10px;width:3px;height:10px;background:#4A2A10;transform:translateX(-50%)}
.hs:hover .tag{transform:translateX(-50%) translateY(-3px) scale(1.06)}
.sp .tag{background:linear-gradient(180deg,#E83B2B,#B82A1D);border-color:#7a1a10}
/* bubbles */
.bub{position:absolute;z-index:4;max-width:220px;background:var(--cream);color:var(--ink);font:700 14px/1.35 'DM Sans',sans-serif;padding:10px 14px;border-radius:16px 16px 16px 4px;box-shadow:0 10px 24px rgba(0,0,0,.35);transform:translate(-10%,-100%);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.bub.on{opacity:1;transform:translate(-10%,-112%)}
.bub b{color:var(--wine)}
/* goat */
#goat{position:absolute;z-index:3;width:5%;height:9%;transform:translate(-50%,-60%);border:0;background:transparent;cursor:pointer}
#goat.jump{animation:gj .9s ease}
@keyframes gj{0%,100%{transform:translate(-50%,-60%)}40%{transform:translate(-50%,-140%) rotate(-10deg)}}
/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(26,10,14,.75),rgba(26,10,14,0));pointer-events:none}
.hud>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:900 clamp(16px,2.4vw,22px) Montserrat,sans-serif;text-transform:uppercase;background:var(--red);color:#fff;padding:5px 10px 3px;box-shadow:3px 3px 0 var(--gold)}
.live{display:inline-flex;align-items:center;gap:7px;font:700 13px 'DM Sans',sans-serif;background:rgba(26,10,14,.55);border:1px solid rgba(241,230,207,.25);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
.tools{display:flex;gap:8px}
.ic{min-width:44px;height:44px;border-radius:999px;border:1px solid rgba(241,230,207,.3);background:rgba(26,10,14,.55);color:var(--cream2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;backdrop-filter:blur(6px);font:800 13px Montserrat,sans-serif}
.ic.pass{background:linear-gradient(180deg,#FFE08A,#C9962E);color:var(--wine2);border:0;box-shadow:0 3px 0 #8f6a1c}
.ic svg{width:20px;height:20px}
.hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;background:rgba(26,10,14,.7);border:1px solid rgba(241,230,207,.25);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;backdrop-filter:blur(6px);transition:opacity .6s;white-space:nowrap}
/* sheet */
.sheet{position:fixed;left:50%;bottom:0;z-index:20;width:min(560px,100%);transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,1,.3,1);background:var(--cream);color:var(--ink);border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-left)) max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.5);border-top:4px solid var(--gold);max-height:82vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet .x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--wine);color:var(--cream2);font:900 18px Montserrat,sans-serif;cursor:pointer}
.sheet .k{font:800 12px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sheet h2{margin:4px 0 8px;font:800 clamp(26px,5vw,32px)/1.05 Fraunces,Georgia,serif;color:var(--wine)}
.sheet .q{font-style:italic;color:#3B2A20;border-left:4px solid var(--red);padding:2px 0 2px 12px;margin:0 0 12px}
.sheet ul{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sheet li{display:flex;gap:10px;align-items:flex-start;background:var(--cream2);border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px}
.sheet li span{flex:0 0 24px;height:24px;border-radius:50%;background:var(--wine);color:var(--cream2);display:grid;place-items:center;font:900 12px Montserrat,sans-serif}
.go{display:flex;justify-content:center;align-items:center;min-height:54px;border-radius:14px;background:var(--red);color:#fff;text-decoration:none;font:900 17px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 5px 0 #8E1F14;border:0;width:100%;cursor:pointer}
.go.alt{background:linear-gradient(180deg,#FFE08A,#C9962E);color:var(--wine2);box-shadow:0 5px 0 #8f6a1c}
.spon{display:flex;gap:10px;align-items:center;border:2px dashed var(--gold);border-radius:14px;padding:12px;margin-bottom:14px;font-size:14px;background:#FFF8E3}
.spon b{display:block;color:var(--wine)}
/* stamp toast */
.stamp{position:fixed;left:50%;top:42%;z-index:30;transform:translate(-50%,-50%) scale(.3) rotate(-20deg);opacity:0;pointer-events:none;width:170px;height:170px;border-radius:50%;border:6px double var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(251,245,232,.96);font:900 15px/1.1 Montserrat,sans-serif;text-transform:uppercase;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.stamp small{font-size:11px;letter-spacing:.1em;color:var(--wine)}
.stamp.on{animation:st 1.8s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes st{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-30deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9) rotate(-12deg)}}
/* passport */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 16px}
.st{aspect-ratio:1;border-radius:50%;border:3px dashed #CDB98E;display:flex;align-items:center;justify-content:center;text-align:center;font:900 10px/1.1 Montserrat,sans-serif;text-transform:uppercase;color:#B8A27A;padding:6px}
.st.ok{border:4px double var(--red);color:var(--red);transform:rotate(-8deg);background:#FFF3EC}
.bar{height:12px;border-radius:12px;background:var(--cream2);overflow:hidden;border:1px solid #DCC9A4}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:12px;transition:width .6s}
.grade{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#6B4A32;margin-top:6px}
/* intro */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,rgba(92,31,43,.85),rgba(26,10,14,.96));transition:opacity .9s}
#intro h1{margin:0;font:900 clamp(34px,7vw,64px)/1 Montserrat,sans-serif;text-transform:uppercase}
#intro h1 span{display:inline-block;background:var(--red);color:#fff;padding:6px 14px 2px;box-shadow:5px 5px 0 var(--gold);margin:4px}
#intro p{max-width:460px;margin:0;color:#E8D7B4;font-size:17px}
#intro .go{width:auto;padding:0 34px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.demo{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:8;font:800 11px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--wine2);padding:5px 9px;border-radius:6px}
@media (max-width:640px){.live span{display:none}.brand b{font-size:14px}.ic .lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="world"><div id="scene">
  <img class="bg" id="day" alt="Il paese di Elvezio di giorno: piazza con il cinema, AutoPostale, grotto, casa della nonna, ufficio postale, bottega, cantina e campanile" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JsTmrBr43PtdGFpI9bsELoimP7/415b8149-807c-4a05-944a-0c9b70624d74.webp">
  <img class="bg" id="night" alt="" aria-hidden="true" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JsTmrBr43PtdGFpI9bsELoimP7/695a1ffb-22da-4237-ae5d-5adce15391fa.webp">
  <div class="fx" id="fx"></div>
  <div id="spots"></div>
  <button id="goat" aria-label="La capra Carmela" style="left:61.3%;top:43.5%"></button>
  <div class="bub" id="b-elv" style="left:44.5%;top:55%"></div>
  <div class="bub" id="b-nonna" style="left:88%;top:27%"></div>
</div></div>

<header class="hud">
  <div class="brand"><b>Il Paese di Elvezio</b><span class="live" aria-live="polite"><i></i><span id="live">In paese adesso: …</span></span></div>
  <div class="tools">
    <button class="ic" id="snd" aria-pressed="false" aria-label="Suoni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="snd-w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" opacity=".35"/></svg></button>
    <button class="ic" id="dn" aria-label="Giorno o notte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ic pass" id="pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17h8"/></svg><span class="lbl">Passaporto</span> <span id="pc">0/9</span></button>
  </div>
</header>
<div class="hint" id="hint">Tocca i cartelli per entrare · trascina per esplorare</div>
<span class="demo">Bozza</span>

<aside class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sh-t"><button class="x" id="sh-x" aria-label="Chiudi">×</button><div id="sh-b"></div></aside>
<div class="stamp" id="stamp" aria-live="polite"></div>

<div id="intro">
  <h1><span>Benvenuto</span><br><span>in paese!</span></h1>
  <p>Qui vive il Signor Elvezio. Ci sono il TG, i giochi, la nonna, una capra che scappa e una cantina chiusa a chiave. Raccogli tutti i timbri del passaporto.</p>
  <button class="go" id="enter">Entra in paese</button>
</div>

<script>
(function(){
var S=[
 {id:'piazza',x:42,y:38,t:'Il cinema in piazza',k:'Il TG di Elvezio',q:'Ogni mercoledì alle 12 accendo lo schermo. Portate la sedia, i pop-corn no: qui si mangiano castagne.',li:['Il TG della settimana: cosa fare nel weekend','Tutti i video di Elvezio','Il voto in caschetti di ogni evento'],cta:'Guarda il TG',href:'https://ilsignorelvezio.com/pages/cosa-fare-in-ticino'},
 {id:'bus',x:27,y:33,t:'Fermata AutoPostale',k:'I giochi',q:'L\'AutoPostale per Locarno è già partito. Di nuovo. Prova tu a prenderlo.',li:['Prendi l\'AutoPostale: 3 livelli','Quanto sei ticinese? Il quiz','La classifica della settimana'],cta:'Gioca adesso',href:'https://ilsignorelvezio.com/pages/giochi'},
 {id:'grotto',x:24,y:80,t:'Il grotto',k:'È stato Elveziato',q:'Qui do i voti ai posti del Ticino. Da 1 a 5 caschetti. Il boccalino è incluso nel giudizio.',li:['I posti votati da Elvezio','Il grotto del mese','Proponi un posto da Elveziare'],cta:'Vedi i posti Elveziati',href:'https://ilsignorelvezio.com/#caschetti'},
 {id:'nonna',x:84,y:44,t:'Casa della nonna',k:'Il detto della nonna',q:'La nonna dice: chi va piano va sano e va lontano. Io intanto ho perso l\'AutoPostale.',li:['Ogni lunedì un detto nuovo','Il consiglio del giorno','Le ricette della nonna (presto)'],cta:'Ascolta la nonna',href:'https://instagram.com/ilsignorelvezio'},
 {id:'posta',x:67,y:31,t:'Ufficio postale',k:'Il Club dei nipoti',q:'Lascia l\'indirizzo email: ogni mercoledì ti mando il TG. Il francobollo lo pago io.',li:['Il TG nella tua email','Gli indizi della caccia prima degli altri','Lo sconto dei nipoti sul merch'],cta:'Entra nel club',href:'https://ilsignorelvezio.com/pages/cosa-fare-in-ticino#weekend'},
 {id:'cantina',x:85,y:80,t:'La cantina',k:'Caccia al tesoro',q:'Questa porta si apre solo quando c\'è la caccia al tesoro. La chiave ce l\'ha Gianni. Credo.',li:['Un buono vero nascosto in Ticino','Gli indizi arrivano in un reel','Il prossimo: sabato 14 novembre'],cta:'Scopri la caccia',href:'https://ilsignorelvezio.com/pages/caccia-di-elvezio'},
 {id:'bottega',x:60,y:62,t:'La bottega',k:'Spazio sponsor',sp:1,q:'Qui ci può stare la tua bottega. Insegna, vetrina, offerta: e io passo a trovarti con il caschetto.',li:['La tua insegna dentro il paese','La scheda con il video Elveziato','Un\'offerta per i nipoti di Elvezio'],cta:'Metti qui la tua bottega',href:'mailto:ilsignorelvezio@gmail.com?subject=Una%20bottega%20nel%20Paese%20di%20Elvezio'},
 {id:'campanile',x:58,y:10,t:'Il campanile',k:'Il calendario',q:'Suona a mezzogiorno. E a dicembre ogni giorno apre una casella dell\'Avvento.',li:['Gli appuntamenti del paese','Il calendario dell\'Avvento (dicembre)','Tocca le campane: suonano!'],cta:'Fai suonare le campane',bell:1}
];
var STAMPS=S.map(function(s){return s.id}).concat(['carmela']);
var NAMES={piazza:'Cinema',bus:'AutoPostale',grotto:'Grotto',nonna:'Nonna',posta:'Posta',cantina:'Cantina',bottega:'Bottega',campanile:'Campanile',carmela:'Carmela'};
var GR=[[0,'Turista con i sandali'],[3,'Ticinese'],[6,'Ticinese doc'],[9,'Nipote ufficiale']];
var ls={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var got=ls.get('paese_timbri')||{};
var $=function(i){return document.getElementById(i)};
// night image
var nightSrc=$('night').getAttribute('src');if(nightSrc.indexOf('__')===0)$('night').remove();
// hotspots
var spots=$('spots');
S.forEach(function(s){var d=document.createElement('div');d.className='hs'+(s.sp?' sp':'')+(got[s.id]?' done':'');d.style.left=s.x+'%';d.style.top=s.y+'%';d.innerHTML='<span class="tag">'+s.t+'</span><button aria-label="'+s.t+'"></button>';d.querySelector('button').addEventListener('click',function(){open(s)});spots.appendChild(d);s.el=d});
function pc(){var n=STAMPS.filter(function(k){return got[k]}).length;$('pc').textContent=n+'/'+STAMPS.length;return n}
pc();
function stamp(id,label){if(got[id])return false;got[id]=Date.now();ls.set('paese_timbri',got);pc();var s=$('stamp');s.innerHTML='<small>Timbro</small>'+label+'<small>Paese di Elvezio</small>';s.classList.remove('on');void s.offsetWidth;s.classList.add('on');sfx('stamp');return true}
// sheet
var sheet=$('sheet');
function open(s){
  var b='<p class="k">'+s.k+'</p><h2 id="sh-t">'+s.t+'</h2><p class="q">«'+s.q+'»</p>';
  if(s.sp)b+='<div class="spon"><div><b>Esempio per gli sponsor</b>Qui al posto di questo testo ci sarebbero l\'insegna, le foto e l\'offerta della tua attività.</div></div>';
  b+='<ul>'+s.li.map(function(x,i){return '<li><span>'+(i+1)+'</span>'+x+'</li>'}).join('')+'</ul>';
  b+=s.bell?'<button class="go alt" id="bellbtn">'+s.cta+'</button>':'<a class="go" href="'+s.href+'" target="_top">'+s.cta+'</a>';
  $('sh-b').innerHTML=b;sheet.classList.add('on');
  if(s.bell){$('bellbtn').addEventListener('click',function(){sfx('bell')})}
  if(stamp(s.id,NAMES[s.id]))s.el.classList.add('done');
  $('hint').style.opacity=0;
}
$('sh-x').addEventListener('click',function(){sheet.classList.remove('on')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')sheet.classList.remove('on')});
// passport
$('pass').addEventListener('click',function(){var n=pc(),g=GR[0][1],nx=null;GR.forEach(function(r,i){if(n>=r[0]){g=r[1];nx=GR[i+1]||null}});
  var b='<p class="k">Il tuo passaporto</p><h2 id="sh-t">'+g+'</h2><p class="q">«'+(n===STAMPS.length?'Tutti i timbri! Sei ufficialmente mio nipote. La nonna è commossa.':'Gira per il paese e raccogli i timbri. Uno è nascosto bene: cerca chi scappa sempre.')+'»</p>';
  b+='<div class="grid">'+STAMPS.map(function(k){return '<div class="st'+(got[k]?' ok':'')+'">'+(got[k]?NAMES[k]:(k==='carmela'?'???':NAMES[k]))+'</div>'}).join('')+'</div>';
  b+='<div class="bar"><i style="width:'+Math.round(n/STAMPS.length*100)+'%"></i></div><div class="grade"><span>'+n+' timbri su '+STAMPS.length+'</span><span>'+(nx?'Prossimo grado: '+nx[1]+' ('+nx[0]+')':'Grado massimo!')+'</span></div>';
  $('sh-b').innerHTML=b;sheet.classList.add('on')});
// goat
$('goat').addEventListener('click',function(){var g=$('goat');g.classList.remove('jump');void g.offsetWidth;g.classList.add('jump');sfx('beee');if(!stamp('carmela','Carmela'))say('b-elv','Carmela! Scendi dal tetto, che poi la Pina si arrabbia!',3500)});
// bubbles
function say(id,t,ms){var b=$(id);b.innerHTML=t;b.classList.add('on');clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('on')},ms||4000)}
var NON=['<b>La nonna:</b> «Mangia, che sei magro!»','<b>La nonna:</b> «Prendi la giacca, che a Corippo fa freddo.»','<b>La nonna:</b> «Chi dorme non piglia pesci. Ma Elvezio dorme e piglia l\'AutoPostale dopo.»','<b>La nonna:</b> «Hai visto la capra? Era sul tetto della Pina.»'];
// day / night
function hourCH(){try{return +new Intl.DateTimeFormat('it-CH',{hour:'numeric',hour12:false,timeZone:'Europe/Zurich'}).format(new Date())}catch(e){return new Date().getHours()}}
var night=hourCH()>=18||hourCH()<7;function setN(v){night=v;document.body.classList.toggle('n',v&&!!$('night'))}
setN(night);
$('dn').addEventListener('click',function(){setN(!night);sfx(night?'owl':'bird')});
// fx
var fx=$('fx');for(var i=0;i<14;i++){var l=document.createElement('span');l.className='leaf';l.style.left=(Math.random()*110)+'%';l.style.animationDuration=(7+Math.random()*7)+'s';l.style.animationDelay=(-Math.random()*12)+'s';l.style.background=['#D9822B','#C4561E','#E0A13A','#B8452A'][i%4];fx.appendChild(l)}
for(var j=0;j<22;j++){var f=document.createElement('span');f.className='fly';f.style.left=(Math.random()*100)+'%';f.style.top=(40+Math.random()*55)+'%';f.style.animationDuration=(3+Math.random()*4)+'s';f.style.animationDelay=(-Math.random()*5)+'s';fx.appendChild(f)}
// live
function live(){fetch('/api/live').then(function(r){return r.json()}).then(function(j){var n=j.n||0;$('live').textContent=n<=1?'In paese adesso: tu e la capra':'In paese adesso: '+n+' persone'}).catch(function(){$('live').textContent='In paese adesso: tu e la capra'})}
live();setInterval(live,30000);
// sound (sintetizzato, niente file)
var ac=null,on=false;
function sfx(k){if(!on||!ac)return;var t=ac.currentTime;function tone(f,d,type,v,at){var o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t+(at||0));g.gain.setValueAtTime(0,t+(at||0));g.gain.linearRampToValueAtTime(v||.2,t+(at||0)+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(at||0)+d);o.connect(g);g.connect(ac.destination);o.start(t+(at||0));o.stop(t+(at||0)+d+.05)}
 if(k==='bell'){[0,.9,1.8].forEach(function(a,i){tone([392,330,262][i],2.4,'sine',.25,a);tone([392,330,262][i]*2.76,1.6,'sine',.06,a)})}
 else if(k==='stamp'){tone(140,.18,'square',.12);tone(90,.25,'sine',.25,.02)}
 else if(k==='beee'){var o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sawtooth';o.frequency.value=480;l.frequency.value=28;lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(g);g.connect(ac.destination);o.start(t);l.start(t);o.stop(t+1);l.stop(t+1)}
 else if(k==='bird'){tone(2400,.12,'sine',.08);tone(2900,.1,'sine',.08,.15);tone(2600,.14,'sine',.08,.3)}
 else if(k==='owl'){tone(420,.5,'sine',.15);tone(380,.8,'sine',.15,.6)}
}
$('snd').addEventListener('click',function(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}on=!on;$('snd').setAttribute('aria-pressed',on);$('snd-w').setAttribute('opacity',on?'1':'.35');if(on)sfx('bell')});
// intro
$('enter').addEventListener('click',function(){var i=$('intro');i.style.opacity=0;setTimeout(function(){i.remove()},900);
  try{ac=new (window.AudioContext||window.webkitAudioContext)();on=true;$('snd').setAttribute('aria-pressed','true');$('snd-w').setAttribute('opacity','1');sfx('bell')}catch(e){}
  var w=$('world');w.scrollLeft=(w.scrollWidth-w.clientWidth)*0.42;
  setTimeout(function(){say('b-elv',night?'Ah, sei arrivato! Fai piano, che la nonna dorme già.':'Ah, sei arrivato! Entra, entra… ma pulisciti le scarpe.',5000)},900);
  setTimeout(function(){say('b-nonna',NON[new Date().getDate()%NON.length],5000)},6500);
  setTimeout(function(){var g=$('goat');g.classList.add('jump');sfx('beee')},12000);
});
// campane a mezzogiorno
setInterval(function(){var d=new Date();if(hourCH()===12&&d.getMinutes()===0&&d.getSeconds()<2)sfx('bell')},1000);
})();
</script>
</body>
</html>
